receivers:
  otlp:
    protocols:
      grpc:
      http:
 
processors:
  batch:
  
exporters:
  elasticsearch:
    endpoints: ["http://elasticsearch_planilla:9200"]
    logs_index: "planilla-otel-logs"  
    traces_index: "planilla-otel-traces"

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]