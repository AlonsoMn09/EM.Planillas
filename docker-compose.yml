services:
  
  postgresql_hexagonal:
    image: postgres:15.3
    container_name: db_planilla
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password2026
      POSTGRES_DB: db_planilla
    ports:
      - 1502:5432
    volumes:
      - D:\Docker\Volumenes\hexagonal_volumen:/var/lib/postgresql/data
    networks:
      - api-planilla-network

  rabbitmq_hexagonal:
    image: rabbitmq:3-management
    container_name: rabbitmq_planilla
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: Password2026
    ports:
      - 1503:15672
      - 5672:5672
    volumes:
      - D:\Docker\Volumenes\hexagonal_rabbitmq:/var/lib/rabbitmq
    networks:
      - api-planilla-network

  elasticsearch_hexagonal:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch_planilla
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - 9200:9200
    volumes:
      - D:\Docker\Volumenes\hexagonal_elasticsearch:/usr/share/elasticsearch/data
    networks:
      - api-planilla-network 

  kibana_hexagonal:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana_planilla
    depends_on:
      - elasticsearch_hexagonal
    restart: always
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch_planilla:9200
    ports:
      - 5601:5601
    networks:
      - api-planilla-network

  otel_collector_hexagonal:
    image: otel/opentelemetry-collector-contrib:0.85.0
    container_name: otel_collector_planilla
    restart: always
    volumes:
      - ./otel-config.yaml:/otel-config.yaml
    command: ["--config=/otel-config.yaml"]
    ports:
      - 4317:4317 
      - 4318:4318 
    networks:
      - api-planilla-network

networks:
  api-planilla-network:
    driver: bridge